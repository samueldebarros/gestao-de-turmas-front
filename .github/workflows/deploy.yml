name: deploy-front

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: producao
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Necessario para o gate de formatacao resolver origin/main. Sem isso
          # ele sai com codigo 2 (gate quebrado) e derruba o deploy.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - run: npm ci

      # Suite, cobertura, formatacao e anti-vazamento do bundle vivem no `verify`
      # (dono unico do gate). Nao duplicar os passos aqui.
      - name: Verificacao completa
        env:
          VERIFY_BASE: origin/main
        run: npm run verify

      - name: Conferir configuracao da Vercel
        run: |
          faltando=0
          [ -z "$VERCEL_ORG_ID" ] && echo "VERCEL_ORG_ID vazio" && faltando=1
          [ -z "$VERCEL_PROJECT_ID" ] && echo "VERCEL_PROJECT_ID vazio" && faltando=1
          [ -z "${{ secrets.VERCEL_TOKEN }}" ] && echo "VERCEL_TOKEN vazio" && faltando=1
          if [ "$faltando" = "1" ]; then
            echo "---"
            echo "Cadastre no environment 'producao' do repositorio:"
            echo "  Variables: VERCEL_ORG_ID, VERCEL_PROJECT_ID"
            echo "  Secret:    VERCEL_TOKEN"
            echo "Sem isso o CLI falha com 'Could not retrieve Project Settings'."
            exit 1
          fi
          echo "org: $VERCEL_ORG_ID"
          echo "project: $VERCEL_PROJECT_ID"

      - name: Publicar na Vercel
        run: npx vercel deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }}

      - name: Verificar que a aplicacao respondeu
        run: |
          BASE="https://gestao-turmas-front.vercel.app"
          TIPO=$(curl -s -o /dev/null -m 60 -w '%{content_type}' "$BASE/i18n/pt-BR.json")
          echo "i18n content-type: $TIPO"
          case "$TIPO" in
            *json*) echo "servindo a aplicacao" ;;
            *) echo "ERRO: resposta nao e JSON - pode ser Deployment Protection interceptando"; exit 1 ;;
          esac
