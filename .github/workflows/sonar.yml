name: sonar

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sonar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Suite com cobertura
        run: npm run verify:test

      - name: Conferir o relatorio de cobertura
        run: |
          RELATORIO=coverage/gestao-turmas-front/lcov.info
          if [ ! -s "$RELATORIO" ]; then
            echo "ERRO: $RELATORIO nao existe ou esta vazio."
            echo "Conteudo de coverage/:"
            find coverage -type f 2>/dev/null | head -20
            exit 1
          fi
          ARQUIVOS=$(grep -c '^SF:' "$RELATORIO")
          COBERTAS=$(awk -F: '/^LH:/ {soma += $2} END {print soma + 0}' "$RELATORIO")
          echo "arquivos no relatorio: $ARQUIVOS"
          echo "linhas cobertas: $COBERTAS"
          if [ "$COBERTAS" -eq 0 ]; then
            echo "ERRO: relatorio existe mas nao registrou nenhuma linha coberta."
            exit 1
          fi

      - name: Analise SonarQube Cloud
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f
        with:
          args: -Dsonar.qualityGate.wait=true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
