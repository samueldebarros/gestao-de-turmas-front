<div class="wizard">
  <app-mensagem
    [visivel]="alerta().visivel"
    [tipo]="alerta().tipo"
    [texto]="alerta().texto"
    (visivelChange)="fecharAlerta()"
  ></app-mensagem>
  <header class="wizard__cabecalho">
    <h2>{{ 'TURMA.CADASTRO.TITULO' | translate }}</h2>
    <app-botao variante="secundario" (acaoBotao)="cancelar()">
      {{ 'TURMA.BOTOES.CANCELAR' | translate }}
    </app-botao>
  </header>

  <app-stepper
    [passos]="passos"
    [passoAtual]="passoAtual"
    [podeAvancar]="podeAvancar"
    (voltar)="voltar()"
    (avancar)="avancar()"
    (concluir)="concluir()"
  >
    @switch (passoAtual) {
      @case (0) {
        <app-passo-informacoes [formGroup]="informacoesGroup"></app-passo-informacoes>
      }
      @case (1) {
        <app-passo-disciplinas
          [grupos]="(disciplinas$ | async) ?? []"
          [selecionados]="alocacoes.value"
          (selecionadosChange)="setAlocacoes($event)"
        ></app-passo-disciplinas>
      }
      @case (2) {
        @if (alunosPagina$ | async; as pagina) {
          <app-passo-alunos
            [pagina]="pagina"
            [selecionados]="alunosIds.value"
            [planilha]="planilha"
            [linhasPreview]="linhas()"
            [errosImportacao]="errosImportacao()"
            (alternar)="alternarAluno($event)"
            (mudarPagina)="mudarPaginaAlunos($event)"
            (confirmarImportacao)="confirmarImportacao()"
          ></app-passo-alunos>
        }
      }
    }
  </app-stepper>
</div>
